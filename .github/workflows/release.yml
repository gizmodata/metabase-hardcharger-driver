name: Release

# A vX.Y.Z tag is a release. Nothing is published until the whole of CI (ci.yml: the jar built and
# checked, Metabase's driver test suite, the end-to-end check) has passed on the tagged commit
# itself: pushing main and the tag together starts both workflows at once, so "CI passed on main"
# would prove nothing.
#
#   1. preflight: the tag is the project's version (info.version in metabase-plugin.yaml), and
#      CHANGELOG.md has that version's section;
#   2. tests: ci.yml, on the tagged commit;
#   3. release: a GitHub Release with the jar that CI built and tested, its SHA-256, and the
#      CHANGELOG section as its notes.
#
# Run by hand (Actions > Release > Run workflow) it is a dry run on that branch: everything but
# the last step, the GitHub Release. Do that once after changing this file, before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release queues, and is never cut off halfway. The name must differ from ci.yml's group, which
# is "<this workflow's name>-<ref>" when called from here: with the same group, this run and the
# CI run it calls would wait on each other for ever.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Version and changelog
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag is the project's version, and CHANGELOG.md has its section
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/tags/* ]]; then
            ci/release-check.sh "$REF_NAME" release-notes.md
          else
            echo "dry run on $REF: no tag to check"
            ci/release-check.sh "" release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: CI on this commit
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read

  release:
    name: GitHub Release
    needs: [preflight, tests]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The jar the build job of this run made, which the end-to-end job of this run tested.
      - uses: actions/download-artifact@v8
        with:
          name: hardcharger-metabase-driver
          path: dist
      - name: Check the jar and write the release notes
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check hardcharger.metabase-driver.jar.sha256
          cd ..
          if [[ "$REF" == refs/tags/* ]]; then
            ci/release-check.sh "$REF_NAME" release-notes.md
          else
            ci/release-check.sh "" release-notes.md
          fi
          ls -l dist
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/hardcharger.metabase-driver.jar
            dist/hardcharger.metabase-driver.jar.sha256
      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Dry run on ${{ github.ref }} - no GitHub Release was created." >> "$GITHUB_STEP_SUMMARY"
